name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1

      # internal/events is behind the `events` build tag, so the default
      # build silently skips it. Compile and vet it explicitly or a break
      # there ships unnoticed (the tag gate keeps the default binary lean;
      # this keeps the tagged build honest).
      - name: Build (events tag)
        run: go build -tags events ./...

      - name: Vet (events tag)
        run: go vet -tags events ./...

      # views/*_templ.go are committed so plain `go build` works without a
      # templ install. Regenerate and compare byte for byte: a .templ edit
      # without a regen, or a templ bump in go.mod without one, fails here.
      # The generator is the module's own pin: `go tool templ` runs the CLI
      # at the version go.mod requires (its tool directive), the same command
      # BuildFlow's templ-generate step runs locally, so a stale templ on
      # PATH cannot emit a different shape. No formatter runs in between:
      # treefmt excludes generated templ files (goimports would merge their
      # import lines), so committed output IS generator output.
      - name: Templ regen drift check
        run: |
          go tool templ generate
          git diff --exit-code views/
          test -z "$(gofmt -l views/)"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Full history (not diff-only): this is a template — its history is
      # every adopter's history, and the repo is young enough that a full
      # scan costs milliseconds (63 commits, ~70 ms locally on 2026-11-24).
      # No setup-go here on purpose: the runner's preinstalled toolchain
      # compiles gitleaks fine, but nothing puts GOPATH/bin on PATH, so the
      # binary's directory is exported explicitly.
      - name: Install gitleaks (pinned)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan git history for secrets
        run: gitleaks git . -v --redact

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # go install (the fleet convention) — golangci-lint-action v6 cannot
      # run the v2 binary. The compiled binary depends only on the pinned
      # version, so one cache key serves it; setup-go already caches the
      # module downloads the lint run needs.
      - name: Cache golangci-lint binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-v2.15.0

      - name: Install golangci-lint (pinned)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Lint
        run: golangci-lint run ./...

  # The OCI image must build from the flake on every change (no Dockerfile
  # by policy) and pass the structure check (user, ports, entrypoint).
  nix-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Build OCI image from flake
        run: nix build .#app-image

      - name: Container structure check
        # `checks` is a per-system attrset, so the shorthand `.#name` form
        # (which resolves packages/apps only) does not work here. The runner
        # is x86_64-linux.
        run: nix build .#checks.x86_64-linux.container-structure

      - name: Package the image (OCI layout, daemonless)
        run: nix build .#checks.x86_64-linux.image-smoke-archive

      - name: Boot, probe and drain the image
        # The runner has a real docker daemon; the smoke script turns the
        # layout into a docker archive (docker loads a tarred OCI layout
        # without applying its tag), boots the container, probes the
        # endpoint matrix, asserts the /version stamp equals the checkout
        # rev, SIGTERMs and greps the five drain phases from the logs.
        # skopeo does the conversion and comes from nix; the runner has none.
        run: nix shell nixpkgs#skopeo -c bash scripts/image-smoke.sh result/layout "$GITHUB_SHA"

  # Darwin without a macOS runner: evaluate every output for every system
  # (aarch64-darwin included) on Linux. Evaluation catches the darwin-only
  # breakage (wrong platform attrs, eval errors) that the x86_64-linux
  # build job cannot see; builds stay Linux-only by design. ~0.3 s locally.
  nix-eval-all-systems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Evaluate flake outputs for all systems
        run: nix flake show --all-systems --json > /dev/null
