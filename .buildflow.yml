# BuildFlow policy — non-default values ONLY (canonical keys per the
# buildflow skill; unknown keys warn on every load).
env:
  # Hermetic resolution: consumers resolve via the proxy; BuildFlow go steps
  # must do the same (workspace-less single module here, but keep the
  # convention so a future multi-module layout inherits it).
  GOWORK: "off"
  # The go.mod floor (1.27.4) is ABOVE BuildFlow's auto-derived fleet floor
  # (1.27.3, raised 2026-10-11) — pin explicitly like pim-sync; caller-wins
  # still applies (an exported GOTOOLCHAIN preempts this). Bump together
  # with go.mod on every appkit floor train.
  GOTOOLCHAIN: "go1.27.4"
